sensors:
  camera:
    - model: stereolabs_zed  
      urdf_enabled: true 
      launch_enabled: true 
      parent: zed_mount_link #fath_pivot_0_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        stereolabs_zed:
          general.camera_flip: false
          general.grab_frame_rate: 30 
          general.serial_number: 0
          general.camera_model: 'zed2i'
          general.grab_resolution: 'HD720'
          #general.base_frame: 'base_link'
          depth.depth_mode: 'NEURAL'
          pos_tracking.pos_tracking_mode: 'GEN_1'
          pos_tracking.map_frame: 'zed_map' 
          pos_tracking.odometry_frame: 'zed_odom' 
          general.self_calib: true
          general.pub_resolution: 'CUSTOM' # The resolution used for image and depth map publishing. 'NATIVE' to use the same `general.grab_resolution` - `CUSTOM` to apply the `general.pub_downscale_factor` downscale factory to reduce bandwidth in transmission
          general.pub_downscale_factor: 2.0
          general.pub_frame_rate: 20.0
          pos_tracking.pos_tracking_enabled: False 
          #pos_tracking.publish_tf: true
          #pos_tracking.publish_map_tf: true
