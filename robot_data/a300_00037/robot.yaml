serial_number: a300-00037
version: 0
system:
  username: robot
  hosts:
    - hostname: cpr-a300-00037
      ip: 192.168.131.1
    - hostname: cpr-a200-0284
      ip: 192.168.130.20
    - hostname: cpr-j100-0921 
      ip: 192.168.130.38   
    - hostname: robotian-LattePanda-Sigma
      ip: 192.168.130.85 
    - hostname: mae-18630-l.sabu.mtu.edu
      ip: 192.168.130.63
    - hostname: desmond-Alienware-m16-R1
      ip: 192.168.130.80
    - hostname: base-station-LattePanda-Sigma
      ip: 192.168.130.65
  ros2:
    namespace: a300_00037  
    domain_id: 0
    middleware:
      implementation: rmw_zenoh_cpp
      # discovery: server
      # servers:
      #   - hostname: cpr-a200-0284
      #     port: 11811
      #     enabled: false
      #   - hostname: cpr-a300-00036
      #     port: 11811 
      #     enabled: true
      #   - hostname: cpr-j100-0921
      #     port: 11811
      #     enabled: false
      #   - hostname: robotian-LattePanda-Sigma
      #     port: 11811
      #     enabled: false
      #   - hostname: mae-18630-l.sabu.mtu.edu
      #     port: 11811 
      #     enabled: false
      #   - hostname: desmond-Alienware-m16-R1
      #     port: 11811
      #     enabled: false
      #   - hostname: base-station-LattePanda-Sigma
      #     port: 11811
      #     enabled: false
#      profile: /etc/clearpath/fastdds_profile3.xml
    workspaces:
    - "/home/robot/colcon_ws/install/setup.bash"
    # - "/home/robot/mocap4r2_ws/install/setup.bash"
platform:
  mcu:
    protocol: proton
  enable_ekf: true
  controller: ps4
  battery:
    model: S_24V20_U1
    configuration: S1P2
  can_adapters:
    - can_dev: usbcan0 
      type: serial
      serial_dev: /dev/usbcan
      baud: s5
  can_bridges:
    - interface: usbcan0
      topic_rx: sensors/charger_0/usbcan0/rx
      topic_tx: sensors/charger_0/usbcan0/tx
  attachments:
    - name: front_bumper
      type: a300.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a300.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a300.top_plate
      model: pacs
      parent: default_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0] 
      enabled: true
    - name: wireless_charger
      type: a300.wireless_charger 
      model: default
      parent: base_link 
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      enabled: true
  extras:
    ros_parameters:      
      ekf_node:
        two_d_mode: True 
        odom0_differential: False 
        odom0_pose_rejection_threshold: 5.0
        odom0_twist_rejection_threshold: 3.0
    urdf: 
      package: mtu32_description 
      path: urdf/robot_description.urdf.xacro
    launch:
      - package: mtu32_bringup
        path: launch/intel_realsense.launch.py  # single camera 
      #  path: launch/intel_realsense_dual.launch.py # multiple cameras
      - package: mtu32_bringup
        path: launch/swift_nav_dual.launch.py    
      - package: mtu32_bringup
        path: launch/bringup_main.launch.py
mounts:
  fath_pivot:
    - parent: top_plate_mount_c1 
      xyz: [0.02, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      angle: 0.0
sensors:
  charger:
    - model: wiferion
      urdf_enabled: true 
      launch_enabled: true
      parent: wireless_charger_face
      xyz: [-0.003, 0.0, 0.01]
      rpy: [0.0, 3.14159, 0.0]
      ros_parameters:
        wiferion:
          canbus_dev: usbcan0
          launch_gateway: false
  imu:
    - model: microstrain_imu
      urdf_enabled: true
      launch_enabled: true
      parent: top_plate_mount_c2
      xyz: [0.0, 0.0, 0.01]
      rpy: [3.14159, 0.0, 0.0]
      ros_parameters:
        microstrain_inertial_driver:
          imu_frame_id: imu_0_link
          port: /dev/microstrain_main
          use_enu_frame: true
          imu_mag_data_rate: 100
  gps:
    - model: swiftnav_duro
      urdf_enabled: true
      launch_enabled: false  
      parent: base_link
      # xyz: [0.32479, 0.21329, 0.44735]
      xyz: [0.321, 0.24, 0.7265]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        duro_node:
          gps_receiver_frame_id: gps_0_link
          ip_address: 192.168.131.31
          ip_port: 55555
          imu_frame_id: gps_0_link
    - model: swiftnav_duro
      urdf_enabled: true
      launch_enabled: false
      parent: base_link
      # xyz: [0.32479, 0.21329, 0.44735]
      xyz: [0.321, -0.24, 0.7265]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        duro_node:
          gps_receiver_frame_id: gps_1_link
          ip_address: 192.168.131.32
          ip_port: 55555
          imu_frame_id: gps_1_link
  lidar2d:
    - model: hokuyo_ust
      urdf_enabled: true
      launch_enabled: true
      parent: wireless_charger_lidar_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        urg_node:
          laser_frame_id: lidar2d_0_laser
          ip_address: 192.168.131.20
          ip_port: 10940
          angle_min: -2.356
          angle_max: 2.356
  camera:
    - model: intel_realsense  # clearpath_config does not support Realsense D405 model
      urdf_enabled: true
      launch_enabled: true
      parent: fath_pivot_0_mount # base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters: 
        intel_realsense:
          camera_name: camera_0
          device_type: d435
          serial_no: "838212070468"
          enable_color: true
          rgb_camera.color_profile: 848,480,30
          enable_depth: true
          depth_module.depth_profile: 848,480,30
          pointcloud.enable: true
          clip_distance: 0.0
manipulators:
  moveit:
    enable: false
  arms:
    - model: universal_robots
      parent: top_plate_mount_e9
      xyz: [0.0, 0.0, 0.05]
      rpy: [0.0, 0.0, 3.14159]
      ur_type: ur5e
      robot_ip: 192.168.131.40
      gripper:
        model: robotiq_2f_85

