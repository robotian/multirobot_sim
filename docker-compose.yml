# Isaac Sim 6.0 (WebRTC streaming) + one ROS 2 Jazzy container per Clearpath A300.
# Robots and sim talk over a private bridge network like robots on a LAN. The ROS 2 middleware is chosen in .env:
#   FLEET_RMW=rmw_zenoh_cpp    (as on the real robots; every session connects to the zenoh-router service)
#   FLEET_RMW=rmw_fastrtps_cpp (FastDDS over UDP only, docker/fastdds_udp.xml)
name: a300-fleet

x-rmw-env: &rmw-env
  RMW_IMPLEMENTATION: ${FLEET_RMW:-rmw_zenoh_cpp}   # not read from RMW_IMPLEMENTATION: a ROS-configured host shell would override .env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  # rmw_zenoh_cpp: every session is a client of the router (ZENOH_ROUTER can point at a real robot's router).
  # The default "peer" mode needs direct links between sessions, but they only listen on loopback, so peers in
  # different containers could not see each other.
  ZENOH_CONFIG_OVERRIDE: mode="client";connect/endpoints=["${ZENOH_ROUTER:-tcp/zenoh-router:7447}"]
  # rmw_fastrtps_cpp
  FASTRTPS_DEFAULT_PROFILES_FILE: /dds/fastdds_udp.xml

x-robot: &robot
  image: a300-robot:jazzy
  build: ./robot
  networks: [ros]
  stdin_open: true
  tty: true
  depends_on: [isaac-sim, zenoh-router]
  environment: &robot-env
    <<: *rmw-env
    DISPLAY: ${DISPLAY:-:0}
    XAUTHORITY: /tmp/.docker.xauth
    QT_X11_NO_MITSHM: "1"
  volumes: &robot-volumes
    - /tmp/.X11-unix:/tmp/.X11-unix
    - /tmp/.docker.xauth:/tmp/.docker.xauth
    - ./docker/fastdds_udp.xml:/dds/fastdds_udp.xml:ro
    - ./scripts:/scripts:ro
    # Shared ROS workspace: the same host folder in every robot container, so a change made from inside one
    # robot's container (or on the host) shows up in all of them.
    - ./colcon_ws:/home/robot/colcon_ws

services:
  # One-shot: named volumes are created root-owned, Isaac Sim runs as uid 1234.
  volume-init:
    image: alpine:3.16.3
    user: root
    command: chown -R 1234:1234 /cache /ov-data /logs /config /compute
    volumes:
      - isaac-cache:/cache
      - isaac-ov-data:/ov-data
      - isaac-logs:/logs
      - isaac-config:/config
      - isaac-compute:/compute
    networks: [ros]

  # rmw_zenoh_cpp router that all sessions (sim and robots) connect to. Idle when using FastDDS.
  zenoh-router:
    image: a300-robot:jazzy
    build: ./robot
    container_name: zenoh-router
    hostname: zenoh-router
    networks: [ros]
    entrypoint: ["/bin/bash", "-c", "exec ros2 run rmw_zenoh_cpp rmw_zenohd"]
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7447"]
      interval: 2s
      timeout: 2s
      retries: 30

  isaac-sim:
    image: a300-isaac-sim:6.0.0
    build:
      context: ./docker
      dockerfile: isaac-sim.Dockerfile
    container_name: a300-isaac-sim
    hostname: isaac-sim
    depends_on:
      volume-init:
        condition: service_completed_successfully
      zenoh-router:
        condition: service_healthy
    networks: [ros]
    command: ["--exec", "/sim/scripts/setup_scene.py"]
    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      NVIDIA_DRIVER_CAPABILITIES: all
      ISAACSIM_HOST: ${ISAACSIM_HOST:-127.0.0.1}
      <<: *rmw-env
      NUM_ROBOTS: ${NUM_ROBOTS:-3}
      CAMERA_WIDTH: ${CAMERA_WIDTH:-640}
      CAMERA_HEIGHT: ${CAMERA_HEIGHT:-360}
      CAMERA_FRAME_SKIP: ${CAMERA_FRAME_SKIP:-0}
      FORCE_REIMPORT: ${FORCE_REIMPORT:-0}
      FLEET_DEBUG: ${FLEET_DEBUG:-0}
      CAMERA_STREAMS: ${CAMERA_STREAMS:-color,depth}
      SIM_RATE_HZ: ${SIM_RATE_HZ:-20}
      FLEET_MERGE_FIXED: ${FLEET_MERGE_FIXED:-0}
      PHYSICS_HZ: ${PHYSICS_HZ:-60}
      FLEET_SETTINGS: ${FLEET_SETTINGS:-}
      FLEET_VIEWPORT_RES: ${FLEET_VIEWPORT_RES:-}
    ports:
      - "49100:49100/tcp"   # WebRTC signalling
      - "47998:47998/udp"   # WebRTC media
    volumes:
      - ./sim:/sim
      - ./docker/fastdds_udp.xml:/dds/fastdds_udp.xml:ro
      - isaac-cache:/isaac-sim/.cache
      - isaac-ov-data:/isaac-sim/.local/share/ov/data
      - isaac-logs:/isaac-sim/.nvidia-omniverse/logs
      - isaac-config:/isaac-sim/.nvidia-omniverse/config
      - isaac-compute:/isaac-sim/.nv/ComputeCache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Robot i is started when the profile n<NUM_ROBOTS> is active (COMPOSE_PROFILES=n${NUM_ROBOTS} in .env), i.e. when
  # NUM_ROBOTS > i. Supports up to 8 robots; to add more, copy a block and extend the profile lists.

  a300_0000:
    <<: *robot
    container_name: a300_0000
    profiles: [n1, n2, n3, n4, n5, n6, n7, n8]
    ports:
      - "8765:8765/tcp"   # Foxglove bridge (ws://<host>:8765)
    hostname: cpr-a300-0000
    environment:
      <<: *robot-env
      ROBOT_NAMESPACE: a300_0000
      ROS_NAMESPACE: a300_0000  # also set by the entrypoint; needed in `docker exec` shells

  a300_0001:
    <<: *robot
    container_name: a300_0001
    profiles: [n2, n3, n4, n5, n6, n7, n8]
    ports:
      - "8766:8765/tcp"   # Foxglove bridge (ws://<host>:8766)
    hostname: cpr-a300-0001
    environment:
      <<: *robot-env
      ROBOT_NAMESPACE: a300_0001
      ROS_NAMESPACE: a300_0001  # also set by the entrypoint; needed in `docker exec` shells

  a300_0002:
    <<: *robot
    container_name: a300_0002
    profiles: [n3, n4, n5, n6, n7, n8]
    ports:
      - "8767:8765/tcp"   # Foxglove bridge (ws://<host>:8767)
    hostname: cpr-a300-0002
    environment:
      <<: *robot-env
      ROBOT_NAMESPACE: a300_0002
      ROS_NAMESPACE: a300_0002  # also set by the entrypoint; needed in `docker exec` shells

  a300_0003:
    <<: *robot
    container_name: a300_0003
    profiles: [n4, n5, n6, n7, n8]
    ports:
      - "8768:8765/tcp"   # Foxglove bridge (ws://<host>:8768)
    hostname: cpr-a300-0003
    environment:
      <<: *robot-env
      ROBOT_NAMESPACE: a300_0003
      ROS_NAMESPACE: a300_0003  # also set by the entrypoint; needed in `docker exec` shells

  a300_0004:
    <<: *robot
    container_name: a300_0004
    profiles: [n5, n6, n7, n8]
    ports:
      - "8769:8765/tcp"   # Foxglove bridge (ws://<host>:8769)
    hostname: cpr-a300-0004
    environment:
      <<: *robot-env
      ROBOT_NAMESPACE: a300_0004
      ROS_NAMESPACE: a300_0004  # also set by the entrypoint; needed in `docker exec` shells

  a300_0005:
    <<: *robot
    container_name: a300_0005
    profiles: [n6, n7, n8]
    ports:
      - "8770:8765/tcp"   # Foxglove bridge (ws://<host>:8770)
    hostname: cpr-a300-0005
    environment:
      <<: *robot-env
      ROBOT_NAMESPACE: a300_0005
      ROS_NAMESPACE: a300_0005  # also set by the entrypoint; needed in `docker exec` shells

  a300_0006:
    <<: *robot
    container_name: a300_0006
    profiles: [n7, n8]
    ports:
      - "8771:8765/tcp"   # Foxglove bridge (ws://<host>:8771)
    hostname: cpr-a300-0006
    environment:
      <<: *robot-env
      ROBOT_NAMESPACE: a300_0006
      ROS_NAMESPACE: a300_0006  # also set by the entrypoint; needed in `docker exec` shells

  a300_0007:
    <<: *robot
    container_name: a300_0007
    profiles: [n8]
    ports:
      - "8772:8765/tcp"   # Foxglove bridge (ws://<host>:8772)
    hostname: cpr-a300-0007
    environment:
      <<: *robot-env
      ROBOT_NAMESPACE: a300_0007
      ROS_NAMESPACE: a300_0007  # also set by the entrypoint; needed in `docker exec` shells

networks:
  ros:
    driver: bridge

volumes:
  isaac-cache:
  isaac-ov-data:
  isaac-logs:
  isaac-config:
  isaac-compute:
