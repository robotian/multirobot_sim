      #     port: 11811
          # enabled: false
    workspaces:
      - "/home/robot/colcon_ws/install/setup.bash"
platform:
  enable_ekf: true
  controller: ps4
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
      xyz: [0.0, 0.0, 0.02]
  extras:
    # urdf:
    #   package: gen3_gripper_description
    #   path: urdf/gen3_custom_gripper.xacro
    # urdf:
    #   package: mtu32_description
    #   path: urdf/extras_combined.urdf.xacro # NOTE: this urdf includes extra object required for collision detection
    launch:
      - path: launch/bringup_main.launch.py
        package: mtu32_bringup
    ros_parameters:
      ekf_node:
        two_d_mode: True
        imu0: 'sensors/imu_0/data'
        imu0_config: [False, False, False, False, False, False, False, False, False, True, True, True, True, True, True]
        imu0_differential: False
        imu0_queue_size: 10
        imu0_remove_gravitational_acceleration: true
      platform_velocity_controller:
        wheel_radius: 0.157
        left_wheel_radius_multiplier: 1.01
        right_wheel_radius_multiplier: 0.96
        wheel_separation_multiplier: 1.875
        linear.x.max_velocity: 1.0
        linear.x.min_velocity: -1.0
#        linear.x.max_acceleration: 2.5
#        linear.x.min_acceleration: -2.5
        angular.z.max_velocity: 1.0 
        angular.z.min_velocity: -1.0
#        angular.z.max_acceleration: 2.5
#        angular.z.min_acceleration: -2.5  
sensors:
  imu:
  - model: microstrain_imu
    urdf_enabled: true
    launch_enabled: true
    parent: default_mount
    xyz: [0.22, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    ros_parameters:
      microstrain_inertial_driver:
        #imu_frame_id: imu_0_link
        port: /dev/microstrain  # a custom udev rule in /etc/udev/rule.d/99-microstrain
        baudrate: 115200
        publish_imu: true
        imu_data_rate: 100
        imu_data_raw_rate: 100
        use_enu_frame: true
        imu_mag_data_rate: 100
        device_setup: false
  camera:
     - model: intel_realsense  # clearpath_config does not support Realsense D405 model
       urdf_enabled: true
       launch_enabled: true
       parent: front_camera_mount_link # base_link
       xyz: [0.0, 0.0, 0.0]
       rpy: [0.0, 0.0, 0.0]
       ros_parameters: 
         intel_realsense:
           camera_name: camera_0
           device_type: d435
           serial_no: "838212070468"
           enable_color: true
           rgb_camera.color_profile: 640,480,30
           enable_depth: true
           depth_module.depth_profile: 640,480,15
           pointcloud.enable: true
#       ros_parameters:
#         intel_realsense:
#           camera_name: camera_1
#           device_type: d405
#           serial_no: "218622279005"
#           enable_color: true
# #          rgb_camera.color_profile: 640,480,30
#           enable_depth: true
# #          depth_module.depth_profile: 640,480,15
#           pointcloud.enable: false
  gps:
    - model: swiftnav_duro
      urdf_enabled: true
      launch_enabled: true
      parent: rail_link
      xyz: [0.01,0.3,0.0]
      rps: [0.0,0.0,0.0]
    - model: swiftnav_duro
      urdf_enabled: true
      launch_enabled: true
      parent: rail_link
      xyz: [0.01,-0.3,0.0]
      rps: [0.0,0.0,0.0]
  lidar2d:
    - model: sick_lms1xx
      urdf_enabled: true
      launch_enabled: true
      parent: top_plate_base_link # front_0_mount
      xyz: [0.312, 0.0, 0.0735]
      rpy: [3.14159, 0.0, 0.0]
      ros_parameters:
        lms1xx:
          frame_id: lidar2d_0_laser
          host: 192.168.131.20
          port: 2111 
