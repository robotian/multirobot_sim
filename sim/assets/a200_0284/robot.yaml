    - hostname: mae-18630-l.sabu.mtu.edu
      ip: 192.168.130.63
    - hostname: desmond-Alienware-m16-R1
      ip: 192.168.130.80
    - hostname: base-station-LattePanda-Sigma
      ip: 192.168.130.67
  ros2: 
    namespace: a200_0284
    domain_id: 1
    middleware:
      implementation: rmw_fastrtps_cpp
      # discovery: server
      # servers:
      #   - hostname: cpr-a200-0284
      #     port: 11811
      #     enabled: true
      #   - hostname: cpr-a300-00036
