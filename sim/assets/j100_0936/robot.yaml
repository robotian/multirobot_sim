# Real MTU Jackal, serial j100-0936 -- derived from the robot's own actual robot.yaml (robot_data/j100_0936/
# robot.yaml), not from Clearpath's generic j100 sample like robot.j100.yaml.tmpl. Carries this specific
# robot's real sensor/attachment/arm loadout: front/rear fenders, a Stereolabs ZED2i stereo camera, a
# Microstrain IMU, a SICK LMS1xx 2D lidar, dual SwiftNav Duro GPS, a Kinova Gen3 Lite arm + 2F Lite gripper, and
# several custom decorative/structural links (top shelf, antenna mounts, "unloader wall" panels). Sibling
# robot.j100_0921.yaml.tmpl is the same robot's twin, minus the lidar (the real 0921 doesn't carry one either).
#
# Differences from the real robot.yaml, and why:
#  - system.hosts: replaced with the same single cpr-j100-0936 entry every template here uses. The real file's
#    multi-host list (base station, other lab robots, ...) is real network topology, meaningless in this sim.
#  - platform.extras (urdf/launch/ros_parameters) is dropped entirely. Its urdf points at mtu32_description's
#    own custom xacro, and its launch entries at mtu32_bringup -- both private lab packages, not installed here
#    and not needed: generate_description succeeds cleanly without it (verified live, 50 links/53 joints,
#    zero errors) since none of the base URDF depends on it. Its ros_parameters.platform_velocity_controller
#    numbers (real calibrated wheel_radius/separation multipliers and speed limits) aren't lost, though --
#    they're carried as data in sim/scripts/setup_scene.py's MODEL_PARAMS["j100_0936"] instead, since this sim
#    drives wheels via its own OmniGraph, not the real platform_velocity_controller.
#  - workspaces: this project's own /home/robot/colcon_ws/install, not the real robot's literal
#    ".../setup.bash" spelling, which hits the clearpath_generator_common strip-bug documented in CLAUDE.md.
# Everything else (attachments, sensors.*, manipulators.arms, links.*) is kept verbatim from the real config.
#
# The double-underscore placeholders (namespace, serial, domain, middleware) are filled in per robot by
# robot/entrypoint.sh and scripts/gen_urdf.sh; the middleware is the one selected by FLEET_RMW in .env, the
# domain by ROS_DOMAIN_ID.
serial_number: j100-0936
version: 0
system:
  # localhost overrides clearpath_config's own default (the container's real OS hostname, from docker-
  # compose.yml's per-slot hostname: field, via socket.gethostname()) -- that default is invalid here because
  # compose's hostname is slot-templated as cpr-<ROBOT_MODEL>-%04d, and this real robot's own model id already
  # contains an underscore (j100_0936), giving e.g. "cpr-j100_0936-0001" -- clearpath_config's Hostname
  # validator rejects underscores outright (confirmed live). j100-0936 (this robot's fixed real serial, see
  # entrypoint.sh) is always valid regardless of which slot it's spawned in.
  localhost: cpr-j100-0936
  hosts:
    - hostname: cpr-j100-0936
      ip: 192.168.131.1
  ros2:
    namespace: j100_0936_0000
    domain_id: 0
    middleware:
      implementation: rmw_fastrtps_cpp  
    workspaces:
      - /home/robot/colcon_ws/install
platform:
  mcu:
    protocol: proton
  enable_ekf: true
  controller: ps4
  attachments:
    - name: front_fender
      type: j100.fender
    - name: rear_fender
      type: j100.fender
      rpy: [0.0, 0.0, 3.1415]
sensors:
  camera:
    - model: stereolabs_zed
      urdf_enabled: true
      launch_enabled: true
      parent: zed_mount_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        stereolabs_zed:
          general.camera_flip: false
          general.grab_frame_rate: 30
          general.serial_number: 0
          general.camera_model: 'zed2i'
          general.grab_resolution: 'HD720'
          depth.depth_mode: 'NEURAL'
          pos_tracking.pos_tracking_mode: 'GEN_1'
          pos_tracking.map_frame: 'zed_map'
          pos_tracking.odometry_frame: 'zed_odom'
          general.self_calib: true
          general.pub_resolution: 'CUSTOM'
          general.pub_downscale_factor: 2.0
          general.pub_frame_rate: 20.0
          pos_tracking.pos_tracking_enabled: False
  imu:
    - model: microstrain_imu
      urdf_enabled: true
      launch_enabled: true
      parent: top_mount_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 3.141592]
      ros_parameters:
        microstrain_inertial_driver:
          imu_frame_id: imu_1_link
          port: /dev/microstrain_main
          use_enu_frame: true
          imu_mag_data_rate: 100
          filter_auto_init: true
          filter_reset_after_config: true
  lidar2d:
    - model: sick_lms1xx
      urdf_enabled: true
      launch_enabled: false
      parent: top_plate_front_link
      xyz: [-0.01, 0.0, 0.075]
      rpy: [3.14159, 0.0, 0.0]
      ros_parameters:
        lms1xx:
          frame_id: lidar2d_0_laser
          host: 192.168.131.20
          port: 2111
          scan_freq: 40.0
  gps:
    - model: swiftnav_duro
      urdf_enabled: true
      launch_enabled: false
      parent: top_shelf_link
      xyz: [0.04, 0.28, 0.255]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        duro_node:
          gps_receiver_frame_id: gps_1_link
          ip_address: 192.168.132.31
          ip_port: 55555
          imu_frame_id: gps_1_link
    - model: swiftnav_duro
      urdf_enabled: true
      launch_enabled: false
      parent: top_shelf_link
      xyz: [0.04, -0.28, 0.255]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        duro_node:
          gps_receiver_frame_id: gps_2_link
          ip_address: 192.168.132.32
          ip_port: 55555
          imu_frame_id: gps_2_link
manipulators:
  moveit:
    enable: false
  arms:
    - model: kinova_gen3_lite
      parent: rear_0_mount
      xyz: [0.0, -0.145, 0.076]
      rpy: [0.0, 0.0, 3.14159]
      ip: 192.168.132.10
      port: 10000
      gripper:
        model: kinova_2f_lite
        xyz: [0.0, 0.0, 0.0]
        rpy: [0.0, 0.0, 0.0]
        poses:
          - name: open_default
            joints: [0.2]
      poses:
        - name: drop
          joints: [-1.7123268271338494, 0.12557976330603243, 1.636511424589256, -1.5684058734004411, -1.6449344704849587, 1.3874696436760219]
        - name: cut_init
          joints: [-0.645260038342241, -1.9158850459396068, 0.9610250425812236, -0.6283142776090488, -1.7287790479900778, -1.3575438205738148]
        - name: look_forward
          joints: [-2.4893112492940705, -1.3493125771928531, -1.8191631253272642, 0.8624603944221925, 1.9388484927611405, -1.8697795881168484]
links:
  frame:
    - name: top_plate_front
      parent: top_plate_link
      xyz: [0.19, 0.0, 0.003]
      rpy: [0.0, 0.0, 0.0]
    - name: zed_mount
      parent: top_plate_front_link
      xyz: [0.02, 0.0, -0.006]
      rpy: [3.14159, 0.0, 0.0]
    - name: top_plate
      parent: top_plate_rail_link
      xyz: [0.05, 0.0, 0.013]
      rpy: [0.0, 0.0, 0.0]
    # top_mount: NOT in the real robot.yaml -- added here. The real file's sensors.imu[0] and links.frame.
    # top_shelf both reference parent: top_mount_link, but nothing in the real config (Clearpath-native or
    # otherwise) ever defines it -- it turned out to be created by the stripped mtu32_description custom xacro
    # (see this template's header), which is lab-private hardware description we don't have. Substituted here
    # as an alias of default_mount (chassis_link + 0.184m up, Jackal's standard top-of-chassis mount plate --
    # the real robot's actual shelf mount is presumably close to this height) so the IMU and the whole
    # top_shelf/antenna/GPS subtree that depends on it resolve to *something* reasonable instead of a dangling
    # link reference (confirmed live: without this, `top_mount_link` appears twice as a joint <parent> and
    # nowhere as a <link>, an invalid URDF that only surfaces once something actually validates references).
    - name: top_mount
      parent: default_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
    - name: top_shelf
      parent: top_mount_link
      xyz: [0.259, 0.0, 0.24]
      rpy: [0.0, 0.0, 0.0]
  box:
    - name: bar_top
      parent: top_shelf_link
      xyz: [0.0, 0.0, 0.235]
      rpy: [0.0, 0.0, 0.0]
      size: [0.04, 0.6, 0.02]
    - name: bar_left
      parent: top_shelf_link
      xyz: [0.0, 0.24, 0.1125]
      rpy: [0.0, 0.0, 0.0]
      size: [0.04, 0.02, 0.225]
    - name: bar_right
      parent: top_shelf_link
      xyz: [0.0, -0.24, 0.1125]
      rpy: [0.0, 0.0, 0.0]
      size: [0.04, 0.02, 0.225]
    - name: top_plate_rail
      parent: default_mount
      xyz: [0.0, 0.0, 0.01]
      rpy: [0.0, 0.0, 0.0]
      size: [0.38, 0.43, 0.02]
    - name: unloader_wall_1
      parent: base_link
      xyz: [-0.17, 0.1, 0.315]
      rpy: [0.0, 0.0, 0.0]
      size: [0.02, 0.320, 0.20]
    - name: unloader_wall_3
      parent: base_link
      xyz: [0.058, 0.1, 0.315]
      rpy: [0.0, 0.0, 0.0]
      size: [0.02, 0.320, 0.20]
    - name: unloader_wall_4
      parent: base_link
      xyz: [-0.056, -0.06, 0.315]
      rpy: [0.0, 0.0, 0.0]
      size: [0.228, 0.02, 0.20]
  cylinder:
    - name: antenna_left
      parent: top_shelf_link
      xyz: [0.03, 0.07, 0.1]
      rpy: [0.0, 0.0, 0.0]
      radius: 0.015
      length: 0.2
    - name: antenna_right
      parent: top_shelf_link
      xyz: [0.03, -0.07, 0.1]
      rpy: [0.0, 0.0, 0.0]
      radius: 0.015
      length: 0.2
